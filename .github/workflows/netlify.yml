name: Publicar en Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: netlify
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar carpeta del sitio
        run: |
          mkdir -p _publicar
          git ls-files | grep -v -E '^(README.md|CNAME|\.github/.*)$' | rsync -a --files-from=- . _publicar/
      - name: Instalar lo que usan las funciones (contador de visitas)
        run: if [ -f package.json ]; then npm install --no-audit --no-fund; fi
      - name: Publicar
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ada4d913-eea0-44ea-9892-ede8e9853413
        run: npx -y netlify-cli@27.5.2 deploy --prod --dir _publicar --no-build
